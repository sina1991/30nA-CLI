name: Linux regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documented Ubuntu prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-tk libpython3-stdlib openssh-client openssh-server nano ncurses-base xauth
          /usr/bin/python3 -c 'import sqlite3, curses, tkinter, tkinter.ttk'
          sudo install -d -m 0755 /run/sshd
      - name: Linux and Python version
        run: |
          uname -a
          /usr/bin/python3 --version
          test -x ./30na
      - name: Regression and integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          THIRTYNA_REAL_SSH: "1"
        run: /usr/bin/python3 tests/run_ci.py
      - name: Verify clean working tree
        run: |
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain)"
