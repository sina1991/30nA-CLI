name: Publish release
on:
  workflow_run:
    workflows: ["Linux regression"]
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish tested release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view v1.0.0-rc.4 >/dev/null 2>&1; then
            gh release create v1.0.0-rc.4 --target "$RELEASE_SHA" --prerelease               --title "30nA-CLI v1.0.0-rc.4" --notes-file docs/RELEASE_NOTES.md
          fi
